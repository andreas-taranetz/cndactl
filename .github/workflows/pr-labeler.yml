name: PR Labeler

on:
  pull_request:
    types:
      - opened
      - reopened

jobs:
  label:
    name: Label PR by Branch Prefix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Apply label based on branch prefix
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const prefixLabelMap = {
              'feat': 'enhancement',
              'fix': 'bug',
              'bug': 'bug',
              'docs': 'documentation',
            };

            // Extract the prefix: the part before the first '/', or the full branch name if no '/' is present.
            const prefix = branch.split('/')[0];
            const label = prefixLabelMap[prefix];

            if (!label) {
              console.log(`No label mapping found for branch prefix '${prefix}' (branch: '${branch}'). Skipping.`);
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [label],
              });
              console.log(`Successfully applied label '${label}' to PR #${context.payload.pull_request.number}.`);
            } catch (error) {
              core.setFailed(`Failed to apply label '${label}': ${error.message}. Ensure the label exists in the repository.`);
            }
